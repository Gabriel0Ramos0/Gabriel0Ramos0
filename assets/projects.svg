<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none">
<defs>
 <linearGradient id="pbg" x1="0" y1="0" x2="1000" y2="330"><stop stop-color="#091711"/><stop offset="1" stop-color="#0C1C15"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1000" y2="0"><stop stop-color="#3AE98C" stop-opacity="0"/><stop offset=".5" stop-color="#3AE98C" stop-opacity=".65"/><stop offset="1" stop-color="#3AE98C" stop-opacity="0"/></linearGradient>

 <filter id="pGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 4.2s ease-in-out infinite}
  .sweep{stroke-dasharray:65 560;stroke-dashoffset:620;opacity:0;animation:sweep 9s linear infinite}
  .cardglow{animation:cardglow 6s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1.55)}}
  @keyframes sweep{0%{stroke-dashoffset:620;opacity:0}10%{opacity:.8}55%{opacity:.55}85%,100%{stroke-dashoffset:0;opacity:0}}
  @keyframes cardglow{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
  @media(prefers-reduced-motion:reduce){.spark,.sweep,.cardglow{animation:none!important}}
 </style>
</defs>
<rect width="1000" height="330" rx="14" fill="url(#pbg)"/>
<g fill="#A5FFC5"><circle class="spark" cx="178" cy="18" r="1.1"/><circle class="spark" style="animation-delay:1.4s" cx="822" cy="28" r="1.2"/><circle class="spark" style="animation-delay:2.6s" cx="972" cy="165" r="1"/><circle class="spark" style="animation-delay:.7s" cx="15" cy="270" r=".9"/><circle class="spark" style="animation-delay:3.1s" cx="490" cy="318" r="1"/><circle class="spark" style="animation-delay:1.9s" cx="650" cy="72" r=".8"/></g>
<g fill="none" stroke="#8BFFC0" stroke-width="1.4" filter="url(#pGlow)"><path class="sweep" d="M-50 320L270 0"/><path class="sweep" style="animation-delay:3s" d="M510 350L850 -20"/><path class="sweep" style="animation-delay:6s" d="M800 350L1080 45"/></g>
<path d="M20 1H980" stroke="url(#edge)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="128" viewBox="0 0 1000 128" fill="none">
<defs><linearGradient id="sbg" x1="0" y1="0" x2="1000" y2="128"><stop stop-color="#08140F"/><stop offset="1" stop-color="#0C1B14"/></linearGradient><linearGradient id="sline" x1="0" y1="0" x2="1000" y2="0"><stop stop-color="#39E98B" stop-opacity="0"/><stop offset=".5" stop-color="#39E98B" stop-opacity=".5"/><stop offset="1" stop-color="#39E98B" stop-opacity="0"/></linearGradient>
 <filter id="sGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .starp{transform-box:fill-box;transform-origin:center;animation:starp 3.7s ease-in-out infinite}
  .scan{stroke-dasharray:100 700;stroke-dashoffset:800;opacity:0;animation:scan 8s linear infinite}
  .chip{animation:chip 5.5s ease-in-out infinite}
  @keyframes starp{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.6)}}
  @keyframes scan{0%{stroke-dashoffset:800;opacity:0}12%{opacity:.7}65%{opacity:.4}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes chip{0%,100%{stroke:#356849}50%{stroke:#70F7A9}}
  @media(prefers-reduced-motion:reduce){.starp,.scan,.chip{animation:none!important}}
 </style>
</defs>
<rect width="1000" height="128" rx="14" fill="url(#sbg)"/>
<g fill="#A5FFC5"><circle class="starp" cx="180" cy="17" r="1"/><circle class="starp" style="animation-delay:1.2s" cx="520" cy="20" r=".9"/><circle class="starp" style="animation-delay:2.4s" cx="930" cy="35" r="1.1"/><circle class="starp" style="animation-delay:.6s" cx="760" cy="15" r=".7"/></g>
<path class="scan" d="M-20 120L160 -15" stroke="#8BFFC0" stroke-width="1.5" filter="url(#sGlow)"/><path d="M20 1H980" stroke="url(#sline)"/>
<text x="32" y="35" fill="#A5FFC5" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">TOOLKIT</text>
